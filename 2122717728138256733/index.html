  --accent:#D97757; --accent-ink:#9C4127; --accent-soft:#F6DCCD; --marker:#F2B494;
  --veil:#C9BCAB; --veil-spoken:#6B5F53; --video-bg:#14120F; --scrim:rgba(33,29,24,.32); --on-accent:#FFFFFF;
  --badge-bg:#9C4127; --on-badge:#FFFFFF;
  --toast-bg:#211D18; --toast-fg:#F7F3EC; --toast-action:#D97757; --press:rgba(33,29,24,.06);
  --sh:rgba(33,29,24,.18); --sh-dock:rgba(33,29,24,.06);
  /* speaker tints (warm-palette companions; never green/teal) */
  --s0:#4B5E86; --s1:#7A4569; --s2:#7A560E; --s3:#A0473F;
  --font-en:"KS Serif","Noto Serif",Georgia,serif;
  --font-ko:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --en-fs:19px; --en-lh:28px; --ko-fs:15.5px; --ko-lh:24px;
  --ease-row:cubic-bezier(.2,0,0,1); --ease-sheet:cubic-bezier(.32,.72,0,1); --ease-in:cubic-bezier(.2,.8,.2,1);
  --safe-b:max(12px, env(safe-area-inset-bottom));
  color-scheme:light;
}
:root.dark {
  --bg:#1C1A17; --surface:#252220; --row-active:#2A2521; --line:#3A3531; --chip:#2F2B27;
  --ink:#F3EDE4; --ink-2:#CDC4B8; --ink-3:#9C9286; --ko:#B7ADA1;
  --en-past:#8E857A; --en-up:#A89F93; --en-act-up:#CDC4B8;
  --accent:#E08A68; --accent-ink:#F0A584; --accent-soft:#4A2C20; --marker:#6E3F2C;
  --veil:#4A433D; --veil-spoken:#A89F93; --video-bg:#0E0D0B; --scrim:rgba(0,0,0,.5); --on-accent:#1C1A17;
  --badge-bg:#E08A68; --on-badge:#1C1A17;
  --toast-bg:#3A3531; --toast-fg:#F3EDE4; --toast-action:#F0A584; --press:rgba(255,255,255,.06);
  --sh:rgba(0,0,0,.45); --sh-dock:rgba(0,0,0,.25);
  --s0:#A9B6D8; --s1:#D6A5C7; --s2:#DDB464; --s3:#E6A096;
  color-scheme:dark;
}
:root[data-size="s"] { --en-fs:17px; --en-lh:25px; --ko-fs:14px; --ko-lh:22px; }
:root[data-size="l"] { --en-fs:22px; --en-lh:32px; --ko-fs:17.5px; --ko-lh:27px; }

*, *::before, *::after { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); }
body {
  font-family:var(--font-ui); color:var(--ink);
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; text-size-adjust:100%;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; word-break:keep-all;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button:focus { outline:none; }
:focus-visible { outline:2px solid var(--accent-ink) !important; outline-offset:2px; }
svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- shell ---------- */
#app { position:fixed; inset:0; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr);
  grid-template-areas:"stage" "seek" "mid" "dock"; background:var(--bg); }
#stage { grid-area:stage; } #seek { grid-area:seek; } #mid { grid-area:mid; } #dock { grid-area:dock; }

/* A. video */
#stage { background:var(--video-bg); padding-top:env(safe-area-inset-top); }
#vbox { position:relative; width:100%; aspect-ratio:var(--ar, 16/9); max-height:38dvh; overflow:hidden; background:var(--video-bg); }
#bHome { position:absolute; top:10px; left:10px; z-index:2; width:36px; height:36px; border-radius:50%; background:rgba(20,18,15,.45); color:#fff;
  display:none; place-items:center; transition:opacity 160ms ease-out; }
#bHome::after { content:""; position:absolute; inset:-6px; }
#bHome svg { width:20px; height:20px; }
.site #bHome { display:grid; }
#vbox.playing #bHome:not(:focus-visible) { opacity:0; pointer-events:none; }
#v { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--video-bg); display:block; }
#vbox.crop #v { object-fit:cover; object-position:50% 0; }
.vlayer { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:16px 24px; color:#F3EDE4; opacity:0; visibility:hidden; transition:opacity 160ms ease-out, visibility 0s 160ms; }
.vlayer.show { opacity:1; visibility:visible; transition:opacity 160ms ease-out; }
#vload .t { font-size:17px; line-height:24px; font-weight:700; max-width:340px; text-wrap:balance; }
#vload .st { font-size:13px; line-height:19px; color:#BDB3A6; margin-top:4px; max-width:340px; text-wrap:balance; }
#vload .cap { font-size:12px; line-height:16px; font-weight:500; color:#9C9286; margin-top:14px; }
#vload .shim { position:absolute; left:0; right:0; bottom:0; height:2px; overflow:hidden; }
#vload .shim::after { content:""; position:absolute; top:0; bottom:0; width:40%; left:0;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); animation:shim 1.2s linear infinite; }
@keyframes shim { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
#vbuf, #vpause { pointer-events:none; }
#vbuf .disc { width:56px; height:56px; border-radius:50%; background:rgba(20,18,15,.62); display:grid; place-items:center; }
.spin { width:28px; height:28px; border-radius:50%; border:2.5px solid rgba(243,237,228,.22); border-top-color:#F3EDE4; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#vpause .disc { width:64px; height:64px; border-radius:50%; background:rgba(20,18,15,.55); display:grid; place-items:center; color:#fff;
  transform:scale(.92); transition:transform 160ms var(--ease-in); }
#vpause.show .disc { transform:none; }
#vpause .disc svg { width:28px; height:28px; }
#vpause .pr { stroke-width:2; }
#bAa { position:absolute; top:10px; right:10px; z-index:2; width:36px; height:36px; border-radius:50%; background:rgba(20,18,15,.45); color:#fff;
  display:grid; place-items:center; transition:opacity 160ms ease-out, transform 160ms ease-out; }
#bAa::after { content:""; position:absolute; inset:-6px; }
#bAa svg { width:20px; height:20px; }
#vbox.playing #bAa:not(:focus-visible) { opacity:0; pointer-events:none; }
#verr { background:var(--video-bg); gap:0; }
.failed #vload { transition:none; }  /* no crossfade of the loading title under the error card */
#verr svg { width:28px; height:28px; color:var(--accent); }
#verr .t { font-size:17px; line-height:24px; font-weight:700; margin-top:8px; text-wrap:balance; }
#verr .b { font-size:14px; line-height:21px; color:#BDB3A6; margin-top:4px; max-width:320px; text-wrap:balance; }
#verr .b code { font-family:inherit; color:#F3EDE4; font-weight:600; }
#verr button[hidden] { display:none; }
#verr button { margin-top:14px; height:44px; padding:0 20px; border-radius:999px; background:var(--accent); color:var(--on-accent);
  font-size:14px; line-height:20px; font-weight:600; transition:transform 160ms ease-out; }
#verr button:active { transform:scale(.97); transition-duration:60ms; }

/* B. seek strip: 18 px band, 36 px hit area (extends 9 px into the video and the list) */
#seek { position:relative; display:flex; align-items:center; gap:10px; height:20px; padding:0 14px; background:var(--bg); touch-action:none; cursor:pointer; z-index:3; }
#seek::before { content:""; position:absolute; left:0; right:0; top:-9px; bottom:-8px; }
#seek .tm { flex:none; font-size:11px; line-height:20px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink-3); pointer-events:none; }
#tCur { text-align:right; } #tDur { text-align:left; }
#track { position:relative; flex:1; min-width:0; height:20px; }
#track .rail, #track .fill { position:absolute; left:0; right:0; top:50%; height:3px; margin-top:-1.5px; border-radius:3px;
  transition:height 120ms ease-out, margin-top 120ms ease-out; }
#track .rail { background:var(--line); }
#track .fill { background:var(--accent); transform-origin:0 50%; transform:scaleX(0); }
#seek.press .rail, #seek.press .fill { height:5px; margin-top:-2.5px; }
#ticks .tk { position:absolute; top:50%; width:5px; height:5px; margin:-8.5px 0 0 -2.5px; border-radius:50%; background:var(--accent); }
#thumb { position:absolute; top:50%; left:0; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--accent);
  box-shadow:0 1px 4px var(--sh); transform:scale(0); transition:transform 120ms ease-out; will-change:transform; }
#seek.press #thumb { transform:scale(.78); }
#seek.drag #thumb { transform:scale(1); }
#bubble { position:absolute; bottom:19px; left:0; padding:3px 8px; border-radius:8px; background:var(--toast-bg); color:var(--toast-fg);
  font-size:12px; line-height:16px; font-weight:500; font-variant-numeric:tabular-nums; transform:translateX(-50%); opacity:0; pointer-events:none;
  transition:opacity 120ms ease-out; white-space:nowrap; box-shadow:0 2px 8px var(--sh); }
#seek.press #bubble { opacity:1; }

/* C. script list */
#mid { position:relative; min-height:0; }
#list { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding-top:14px; touch-action:pan-y; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 32px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 32px), transparent 100%); }
#list::-webkit-scrollbar { display:none; }
.row { position:relative; margin:0 8px; padding:9px 12px 14px 14px; border-radius:14px; cursor:pointer;
  transition:background-color 260ms var(--ease-row); -webkit-touch-callout:none; }
.row.gap { margin-top:20px; }
.gd { position:absolute; top:-17px; left:0; right:0; text-align:center; font-size:10px; line-height:12px; letter-spacing:.3em;
  color:color-mix(in srgb, var(--ink-3) 45%, transparent); pointer-events:none; }
/* meta line: timestamp · speaker ......... status badges · star  (fixed 20 px height on every row -> no reflow) */
.meta { display:flex; align-items:center; gap:7px; height:20px; margin:0 -4px 4px 0; white-space:nowrap; font-family:var(--font-ui); }
.ts { position:relative; flex:none; font-size:11.5px; line-height:20px; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:.01em;
  color:var(--ink-3); transition:color 200ms var(--ease-row); }
.ts::after { content:""; position:absolute; left:-14px; right:-8px; top:-12px; bottom:-12px; }
.row.on .ts, .row.pre .ts { color:var(--accent-ink); }
.sk { flex:none; height:18px; padding:0 7px; border-radius:999px; font-size:11px; line-height:18px; font-weight:700; letter-spacing:.01em;
  color:var(--sc); background:color-mix(in srgb, var(--sc) 12%, transparent); }
.sk.cont { padding:0; background:none; font-weight:600; opacity:.8; }
.mr { margin-left:auto; display:flex; align-items:center; gap:6px; min-width:0; }
.row::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background:var(--accent);
  opacity:0; transform:scaleY(.6); transition:opacity 220ms var(--ease-row), transform 220ms var(--ease-row); }
.row.on, .row.pre { background-color:var(--row-active); }
.row.on { animation:rowIn 260ms var(--ease-in); }
@keyframes rowIn { from { transform:scale(.985); } }
.row.on::before { opacity:1; transform:none; }
.row.loop::before { background:repeating-linear-gradient(to bottom, var(--accent) 0 6px, transparent 6px 10px); }
.row.press { background-color:color-mix(in srgb, var(--row-active) 60%, transparent); transition-duration:100ms; }
.row.on.press { background-color:color-mix(in srgb, var(--row-active) 70%, var(--ink) 4%); }
.en { margin:0; font-family:var(--font-en); font-size:var(--en-fs); line-height:var(--en-lh); font-weight:400; letter-spacing:-0.005em;
  color:var(--en-up); text-wrap:pretty; overflow-wrap:break-word; }
.ko { margin:6px 0 0; font-family:var(--font-ko); font-size:var(--ko-fs); line-height:var(--ko-lh); letter-spacing:-0.01em; color:var(--ko);
  word-break:keep-all; overflow-wrap:break-word; text-wrap:balance; }
.row:not(.on) .ko { opacity:.85; }
.row.past .en { color:var(--en-past); }
.row.pre .en { color:var(--ink); }
.w { border-radius:5px; padding:0 3px; margin:0 -3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:background-color 0ms; }
.row.on .w { color:var(--en-act-up); transition:color 120ms ease-out, background-color 0ms; }
.row.on .w.sp { color:var(--ink); }
.row.on .w.cur { color:var(--ink); background-color:var(--marker); transition:color 120ms ease-out, background-color 90ms ease-out; }
.buffering .row.on .w.cur { animation:pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity:.45; } }
.lp { display:none; font-size:11px; line-height:14px; font-weight:700; letter-spacing:.04em;
  color:var(--on-badge); background:var(--badge-bg); border-radius:999px; height:20px; padding:3px 8px; white-space:nowrap; }
.row.loop .lp { display:inline-block; }
.st { position:relative; display:none; width:24px; height:20px; place-items:center; color:var(--ink-3); }
.st::after { content:""; position:absolute; inset:-12px -10px; }
.st svg { width:14px; height:14px; fill:currentColor; stroke:currentColor; stroke-width:1.75; stroke-linejoin:round; display:block; }
.row.star .st { display:grid; color:var(--accent); }
.row.on .st { display:grid; }
.row.on .st svg { width:18px; height:18px; fill:none; }
.row.on.star .st svg { fill:currentColor; }
.st.pop svg { animation:pop 220ms var(--ease-in); }
@keyframes pop { 50% { transform:scale(1.25); } }
.say, .hold { display:none; align-items:center; gap:4px; font-size:12.5px; line-height:18px; font-weight:600; color:var(--accent-ink); white-space:nowrap; }
.say svg, .hold svg { width:15px; height:15px; stroke-width:2; }
.hold { color:var(--ink-2); font-weight:500; }
.hold b { font-weight:700; color:var(--accent-ink); }
.say .num { display:none; font-variant-numeric:tabular-nums; }
.row.wait .say, .row.held .hold { display:flex; }
.row.held .hold { animation:fadeIn 240ms ease-out; }
#cdBar { position:absolute; left:14px; right:12px; bottom:6px; height:3px; border-radius:2px; background:var(--accent);
  transform-origin:0 50%; animation:drainX var(--w, 3s) linear forwards; pointer-events:none; }
@keyframes drainX { from { transform:scaleX(1); } to { transform:scaleX(0); } }
/* key expressions: dotted terracotta underline on the chunk; coexists with the .cur marker, past/upcoming colours and veils */
.nt { --dot:color-mix(in srgb, var(--accent) 85%, transparent);
  background-image:radial-gradient(circle at 1.25px 1.25px, var(--dot) 1px, transparent 1.35px);
  background-size:4.5px 2.5px; background-repeat:repeat-x; background-position:0 100%; background-origin:content-box;
  -webkit-box-decoration-break:clone; box-decoration-break:clone; padding:8px 0; cursor:pointer; border-radius:5px; transition:background-color 120ms; }
.row.on .nt .w.cur { background-image:inherit; background-size:4.5px 2.5px; background-repeat:repeat-x; background-position:0 100%; background-origin:content-box; }
.row.past .nt { --dot:color-mix(in srgb, var(--accent) 55%, transparent); }
.nt.sv { --dot:var(--accent-ink); }
.nt.press { background-color:color-mix(in srgb, var(--accent) 14%, transparent); }
.hide-en .row:not(.rv-en) .nt { background-image:none; }
.coach { margin-top:8px; font-family:var(--font-ui); font-size:13px; line-height:18px; font-weight:500; color:var(--ink-3); animation:fadeIn 300ms ease-out; }
@keyframes fadeIn { from { opacity:0; } }
/* hide modes — Korean: frosted spoiler text; English: cloze rules under each word (karaoke runs on the rules) */
.hide-ko .row:not(.rv-ko) .ko { color:transparent; text-shadow:0 0 9px color-mix(in srgb, var(--ko) 70%, transparent); }
.hide-ko .row.rv-ko .ko { transition:color 200ms ease-out, text-shadow 200ms ease-out; }
.hide-en .en .w { position:relative; }
.hide-en .en .w::after { content:""; position:absolute; left:3px; right:3px; bottom:4px; height:2px; border-radius:1px; background-color:var(--veil); }
.hide-en .row:not(.rv-en) .en .w, .hide-en .row.on:not(.rv-en) .en .w.cur { color:transparent; background-color:transparent; }
.hide-en .row.on .en .w::after { transition:background-color 90ms ease-out, opacity 200ms ease-out; }
.hide-en .row.on .en .w.sp::after { background-color:var(--veil-spoken); }
.hide-en .row.on .en .w.cur::after { background-color:var(--accent); height:3px; }
.hide-en .row.rv-en .en .w::after { opacity:0; }
.hide-en .row.rv-en .en .w { transition:color 200ms ease-out; }
#spacer { pointer-events:none; }
#endb { display:none; pointer-events:auto; flex-direction:column; align-items:center; gap:14px; padding:28px 24px 0; text-align:center; animation:fadeIn 300ms ease-out; }
#endb.show { display:flex; }
#endb .t { font-size:15px; line-height:22px; color:var(--ink-2); }
#endb .acts { display:flex; gap:8px; }
#empty { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
#empty .t { font-size:17px; line-height:24px; font-weight:700; }
#empty .b { font-size:14px; line-height:21px; color:var(--ink-3); margin-top:4px; }
.notx #empty { display:flex; }
.notx #ctl { visibility:hidden; }

/* pill + toast */
#pill { position:absolute; left:50%; bottom:12px; height:48px; padding:4px 0; transform:translate(-50%, 8px); opacity:0; visibility:hidden;
  transition:opacity 140ms ease-in, transform 140ms ease-in, visibility 0s 140ms; z-index:4; }
#pill span { display:flex; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:999px; background:var(--surface);
  box-shadow:0 6px 20px var(--sh), 0 0 0 1px var(--line); font-size:14px; line-height:20px; font-weight:600; color:var(--ink); transition:transform 160ms ease-out, background-color 90ms; }
#pill svg { width:18px; height:18px; color:var(--accent-ink); stroke-width:2; }
#pill:active span { transform:scale(.97); background:var(--accent-soft); transition-duration:60ms; }
#pill.show { opacity:1; visibility:visible; transform:translate(-50%, 0); transition:opacity 180ms ease-out, transform 180ms ease-out; }
#toast { position:absolute; left:50%; top:10px; max-width:min(360px, calc(100% - 32px)); width:max-content; z-index:5;
  display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:12px; background:var(--toast-bg); color:var(--toast-fg);
  box-shadow:0 6px 20px var(--sh); font-size:14px; line-height:20px; font-weight:600;
  transform:translate(-50%, -6px); opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity 160ms ease-out, transform 160ms ease-out, visibility 0s 160ms; }
#toast.show { opacity:1; visibility:visible; transform:translate(-50%, 0); pointer-events:auto; transition:opacity 200ms ease-out, transform 200ms var(--ease-in); }
#toast button { color:var(--toast-action); font-weight:700; margin:-10px -8px -10px 0; padding:10px 8px; white-space:nowrap; }

/* D. dock */
#dock { position:relative; background:var(--surface); padding:8px 16px var(--safe-b);
  box-shadow:0 -1px 0 var(--line), 0 -8px 24px var(--sh-dock); z-index:3; }
#ctl { display:flex; gap:8px; height:44px; margin-bottom:4px; }
#ctl .seg { flex:1; }
.chip { display:flex; align-items:center; justify-content:center; gap:5px; height:44px; padding:0 14px; border-radius:999px;
  background:var(--chip); color:var(--ink); font-size:14px; line-height:20px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; min-width:0; transition:transform 160ms ease-out, background-color 150ms ease-out, color 150ms; }
.chip svg { width:16px; height:16px; stroke-width:2; color:var(--ink-3); }
.chip.on { background:var(--accent-soft); color:var(--accent-ink); }
.chip.on svg { color:var(--accent-ink); }
#cSpeed { width:72px; flex:none; padding:0 8px; }
.chip:active, .tb:active, .tg:active, .seg button:active, .speeds button:active { transform:scale(.97); transition-duration:60ms; }
#bar { position:relative; height:56px; }
/* fixed 5-slot transport: [반복] [이전] [play] [다음] [재생 방식] — slot boxes never change in any mode/state, only their content */
#transport { position:absolute; inset:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px minmax(0,1fr) minmax(0,1fr);
  align-items:center; justify-items:center; }
.tb { position:relative; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; color:var(--ink); transition:transform 160ms ease-out, background-color 90ms, opacity 160ms; }
.tb:active { background:var(--press); }
.tb svg.i { fill:currentColor; stroke:none; }
.tg { position:relative; width:72px; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; color:var(--ink-3);
  transition:transform 160ms ease-out, color 150ms; }
.tg .dc { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; transition:background-color 150ms ease-out; }
.tg .dc svg { width:22px; height:22px; }
.tg .lb { font-size:10px; line-height:12px; font-weight:600; white-space:nowrap; }
.tg[aria-pressed="true"], .tg.on { color:var(--accent-ink); }
.tg[aria-pressed="true"] .dc, .tg.on .dc { background:var(--accent-soft); }
.tg .dc svg { opacity:0; position:absolute; transition:opacity 120ms ease-out; }
.tg .dc { position:relative; }
.tg .dc svg.sel { opacity:1; position:static; }
/* prev slot shows "다시 듣기" during the shadowing wait (same 48 px box, icon swap only) */
#bPrev svg.i { position:absolute; left:12px; top:12px; transition:opacity 120ms ease-out; }
#bPrev .rp { opacity:0; fill:none; stroke:currentColor; stroke-width:2; }
#dock.waiting #bPrev .pv { opacity:0; } #dock.waiting #bPrev .rp { opacity:1; }
/* "one sentence, then stop": the next button carries the cue */
#bNext.cue { color:var(--accent-ink); background:var(--accent-soft); }
#bNext.cue::before { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent); animation:cue 1.8s ease-out infinite; pointer-events:none; }
@keyframes cue { 0% { transform:scale(.9); opacity:.9; } 70%, 100% { transform:scale(1.22); opacity:0; } }
#bPlay { width:56px; height:56px; background:var(--accent); color:var(--on-accent); box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); }
#bPlay:active { background:var(--accent); filter:brightness(.95); }
#bPlay svg.i { position:absolute; left:16px; top:16px; width:24px; height:24px; opacity:0; transform:scale(.8); transition:opacity 120ms ease-out, transform 120ms ease-out; }
#bPlay .pr, #bPlay .pk { fill:none !important; stroke:currentColor !important; stroke-width:2; }
#bPlay[data-s="play"] .pi, #bPlay[data-s="pause"] .pp, #bPlay[data-s="end"] .pr, #bPlay[data-s="pick"] .pk { opacity:1; transform:none; }
#bPlay .pi { margin-left:1.5px; }
#bPlay .ring { position:absolute; inset:-4px; border-radius:50%; border:2.5px solid transparent; border-top-color:var(--accent); opacity:0; pointer-events:none; }
#bPlay.queued .ring { opacity:1; animation:spin .8s linear infinite; }
#bPlay svg.cd { position:absolute; inset:-5px; width:66px; height:66px; transform:rotate(-90deg); opacity:0; pointer-events:none; overflow:visible; }
#bPlay svg.cd circle { fill:none; stroke-width:3; }
#bPlay svg.cd .bg { stroke:var(--line); }
#bPlay svg.cd .fg { stroke:var(--accent); stroke-linecap:round; stroke-dasharray:197.92; stroke-dashoffset:0; }
#dock.waiting #bPlay svg.cd { opacity:1; }
#dock.waiting #bPlay svg.cd.run .fg { animation:drain var(--w, 3s) linear forwards; }
@keyframes drain { to { stroke-dashoffset:-197.92; } }

/* segmented controls (dock + sheet) */
.seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; padding:2px; border-radius:12px; background:var(--chip); }
.seg button { height:40px; border-radius:10px; font-size:14px; line-height:20px; font-weight:600; color:var(--ink-3);
  transition:transform 160ms ease-out, background-color 120ms, color 120ms; }
.seg button[aria-checked="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px var(--sh); }

/* sheets */
#scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity 200ms ease-in, visibility 0s 200ms; z-index:10; }
#scrim.show { opacity:1; visibility:visible; transition:opacity 260ms var(--ease-sheet); }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--surface); border-radius:20px 20px 0 0;
  padding:8px 20px calc(var(--safe-b) + 12px); box-shadow:0 -12px 40px var(--sh);
  transform:translateY(105%); visibility:hidden; transition:transform 200ms ease-in, visibility 0s 200ms; touch-action:pan-y; max-width:560px; margin:0 auto;
  max-height:calc(100dvh - 48px - env(safe-area-inset-top));  /* a tappable strip of scrim always stays above a tall sheet */ overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; }
.sheet::-webkit-scrollbar { display:none; }
.sheet.fit, .sheet .handle, .sheet h2 { touch-action:none; }
.handle { position:relative; }
.handle::before { content:""; position:absolute; left:-60px; right:-60px; top:-8px; bottom:-12px; }
.sheet:focus { outline:none; }
.sheet.show { transform:translateY(var(--dy, 0px)); visibility:visible; transition:transform 260ms var(--ease-sheet); }
.sheet.dragging { transition:none; }
.handle { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
.sheet h2 { margin:0 0 16px; font-size:17px; line-height:24px; font-weight:700; }
.sheet .sub { margin:-14px 0 16px; font-size:13px; line-height:18px; color:var(--ink-3);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.sheet h3 { margin:18px 0 8px; font-size:12px; line-height:16px; font-weight:500; color:var(--ink-3); }
.speeds { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.speeds button { height:48px; border-radius:12px; background:var(--chip); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
  transition:transform 160ms ease-out, background-color 120ms, color 120ms; }
.speeds button[aria-checked="true"] { background:var(--ink); color:var(--bg); }
.speedcap { display:flex; justify-content:space-between; margin-top:8px; padding:0 4px; font-size:12px; line-height:16px; font-weight:500; color:var(--ink-3); }
#segFont button { height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
#segFont .smp { line-height:1.2; font-weight:400; color:var(--ink); white-space:nowrap; }
#segFont .smp .e { font-family:var(--font-en); }
#segFont .smp .k { font-family:var(--font-ko); }
#segFont .lb { font-size:11px; line-height:14px; font-weight:500; color:var(--ink-3); }
.swrow { display:flex; align-items:center; justify-content:space-between; width:100%; height:48px; margin-top:12px; text-align:left;
  font-size:15px; line-height:22px; font-weight:500; color:var(--ink); }
.sw { position:relative; flex:none; width:44px; height:26px; border-radius:13px; background:var(--line); transition:background-color 150ms ease-out; }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform 150ms ease-out; }
.swrow[aria-checked="true"] .sw { background:var(--accent); }
.swrow[aria-checked="true"] .sw::after { transform:translateX(18px); }

/* list rows in sheets (내 표현 / 앱으로 설치) */
.lrows { margin:18px -8px 0; border-top:1px solid var(--line); padding-top:6px; }
.lrow { display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:6px 8px; border-radius:12px; text-align:left;
  font-size:15px; line-height:21px; font-weight:500; color:var(--ink); transition:background-color 90ms; }
.lrow:active { background:var(--press); }
.lrow .ic { width:36px; height:36px; flex:none; border-radius:10px; display:grid; place-items:center; background:var(--chip); color:var(--accent-ink); }
.lrow .ic svg { width:20px; height:20px; }
.lrow .tx { flex:1; min-width:0; }
.lrow .tx small { display:block; font-size:12px; line-height:16px; color:var(--ink-3); font-weight:400; margin-top:1px; }
.lrow .val { font-size:14px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.lrow .chev { width:18px; height:18px; color:var(--ink-3); }
/* play-mode sheet */
.modes { display:flex; flex-direction:column; gap:8px; }
.modes button { display:flex; align-items:center; gap:14px; width:100%; min-height:64px; padding:10px 14px; border-radius:14px; text-align:left;
  background:var(--chip); border:1.5px solid transparent; transition:transform 160ms ease-out, background-color 120ms, border-color 120ms; }
.modes button:active { transform:scale(.985); transition-duration:60ms; }
.modes .ic { width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--ink-2); }
.modes .ic svg { width:22px; height:22px; }
.modes b { display:block; font-size:15px; line-height:21px; font-weight:700; color:var(--ink); }
.modes small { display:block; font-size:13px; line-height:18px; color:var(--ink-3); margin-top:1px; }
.modes button[aria-checked="true"] { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 55%, transparent); }
.modes button[aria-checked="true"] .ic { background:var(--accent); color:var(--on-accent); }
.modes button[aria-checked="true"] small { color:var(--ink-2); }
.sheet .foot { margin:14px 2px 0; font-size:12px; line-height:17px; color:var(--ink-3); }
/* key-expression sheet */
.ntop { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:12px; line-height:16px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.tag { height:22px; padding:0 9px; border-radius:999px; font-size:12px; line-height:22px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); }
.ntop .sp { margin-left:auto; }
.sheet .nchunk { margin:0 0 6px; font-family:var(--font-en); font-size:26px; line-height:34px; font-weight:400; color:var(--ink); letter-spacing:-0.01em; text-wrap:balance; }
.nko { margin:0 0 14px; font-family:var(--font-ko); font-size:17px; line-height:25px; font-weight:600; color:var(--accent-ink); }
.nsec { margin:0 0 12px; }
.nsec h4 { margin:0 0 2px; font-size:12px; line-height:16px; font-weight:600; color:var(--ink-3); }
.nsec p { margin:0; font-family:var(--font-ko); font-size:15px; line-height:23px; color:var(--ink-2); word-break:keep-all; }
.nex { margin:4px 0 0; padding:10px 14px; border-radius:12px; background:var(--chip); }
.nex .e { font-family:var(--font-en); font-size:16px; line-height:24px; color:var(--ink); }
.nex .k { font-family:var(--font-ko); font-size:14px; line-height:21px; color:var(--ink-3); margin-top:2px; }
.nsec .nsrc { margin:0 0 14px; font-family:var(--font-en); font-size:15px; line-height:23px; color:var(--ink-3); }
.nsrc mark { background:none; color:var(--ink); text-decoration:underline dotted var(--accent) 2px; text-underline-offset:4px; }
.nacts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
/* when the note sheet scrolls (landscape) the actions stay reachable */
.sheet:not(.fit) .nacts { position:sticky; bottom:calc(-1 * (var(--safe-b) + 12px)); margin:8px -20px calc(-1 * (var(--safe-b) + 12px));
  padding:10px 20px calc(var(--safe-b) + 12px); background:var(--surface); box-shadow:0 -1px 0 var(--line); }
.nacts .pri { grid-column:1 / -1; height:48px; border-radius:14px; background:var(--accent); color:var(--on-accent); font-size:15px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:transform 160ms ease-out, filter 90ms; }
.nacts .pri svg { width:18px; height:18px; }
.nacts .pri:active { transform:scale(.98); filter:brightness(.95); transition-duration:60ms; }
.nacts .chip { height:44px; }
.nacts .chip svg { width:16px; height:16px; }
#nSave.on svg { fill:currentColor; }
/* 내 표현 list */
#mineList { display:flex; flex-direction:column; gap:2px; margin:0 -8px; }
.mi { display:block; width:100%; padding:10px 8px; border-radius:12px; text-align:left; transition:background-color 90ms; }
.mi:active { background:var(--press); }
.mi .c { font-family:var(--font-en); font-size:17px; line-height:24px; color:var(--ink); }
.mi .k { font-family:var(--font-ko); font-size:14px; line-height:20px; color:var(--ink-2); margin-top:1px; }
.mi .m { font-size:11.5px; line-height:16px; color:var(--ink-3); margin-top:3px; font-variant-numeric:tabular-nums; }
.mempty { padding:18px 4px 6px; font-size:14px; line-height:21px; color:var(--ink-3); text-align:center; text-wrap:balance; }
/* install hint */
.steps { margin:0; padding:0; list-style:none; counter-reset:st; }
.steps li { position:relative; padding:8px 0 8px 36px; font-size:15px; line-height:22px; color:var(--ink-2); counter-increment:st; }
.steps li::before { content:counter(st); position:absolute; left:0; top:7px; width:24px; height:24px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-ink); font-size:13px; line-height:24px; font-weight:700; text-align:center; }
.steps b { color:var(--ink); }
.steps svg { width:18px; height:18px; vertical-align:-3px; color:var(--accent-ink); }

/* ---------- landscape: split view (video + controls left, script right) ---------- */
@media (orientation: landscape) and (min-aspect-ratio: 13/10) {
  #app { grid-template-columns:minmax(0,58fr) minmax(0,42fr); grid-template-rows:minmax(0,1fr) auto auto;
    grid-template-areas:"stage mid" "seek mid" "dock mid"; }
  #stage { display:grid; place-items:center; min-height:0; container-type:size;
    padding:env(safe-area-inset-top) 0 0 env(safe-area-inset-left); }
  #vbox { width:min(100cqw, 100cqh * var(--arn, 1.7778)); max-height:none; }
  #seek { padding-left:calc(14px + env(safe-area-inset-left)); height:24px; }
  #seek .tm, #track { line-height:24px; height:24px; }
  #mid { border-left:1px solid var(--line); margin-right:env(safe-area-inset-right); }
  #list { padding-top:max(10px, env(safe-area-inset-top)); }
  #dock { padding:4px 14px max(6px, env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); box-shadow:0 -1px 0 var(--line); }
  #ctl { height:44px; margin-bottom:2px; }
  #ctl .chip { height:44px; } #ctl .seg button { height:40px; }
  #bar { height:56px; }
  .sheet { max-width:520px; }
}

/* narrow viewports = large page zoom / Android font scaling (130 % -> 317 px, 200 % -> 206 px wide): the dock shrinks, nothing overlaps */
@media (max-width: 360px), (orientation: landscape) and (min-aspect-ratio: 13/10) and (max-width: 640px) {
  #dock { padding-left:8px; padding-right:8px; }
  #ctl { gap:6px; }
  #cSpeed { width:56px; padding:0 4px; }
  .seg button { font-size:13px; letter-spacing:-0.02em; }
  .tg { width:100%; max-width:72px; }
  .tg .lb { max-width:100%; overflow:hidden; text-overflow:ellipsis; }
}
@media (max-width: 300px) {
  #dock { padding-left:4px; padding-right:4px; }
  #ctl { gap:4px; }
  #cSpeed { width:46px; font-size:13px; }
  .seg { gap:0; }
  .seg button { font-size:12px; letter-spacing:-0.04em; padding:0 1px; }
  .tb:not(#bPlay) { width:100%; max-width:48px; }
  .tb:not(#bPlay) svg.i { left:50% !important; margin-left:-12px; }
  .tg .lb { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .nt { padding:6px 0; }
}

@media (prefers-reduced-motion: reduce) {
  .row, .row::before, .row.on .w, .row.on .w.cur, .hide-en .row.rv-en .en .w, .hide-en .row.on .en .w::after, .chip, .tb, .tg, #thumb,
  .speeds button, .seg button, #bPlay svg.i, .vlayer, #vpause .disc, #bAa, .sw, .sw::after { transition-duration:0ms !important; }
  .row.on, .bdg .st.pop svg, .coach, #endb, .buffering .row.on .w.cur { animation:none !important; }
  .sheet, .sheet.show { transform:none !important; opacity:0; transition:opacity 120ms ease-out, visibility 0s 120ms !important; }
  .sheet.show { opacity:1; transition:opacity 120ms ease-out !important; }
  #pill, #pill.show { transform:translate(-50%, 0) !important; transition:opacity 120ms ease-out, visibility 0s 120ms !important; }
  #toast, #toast.show { transform:translate(-50%, 0) !important; transition:opacity 120ms ease-out, visibility 0s 120ms !important; }
  #pill.show, #toast.show { transition:opacity 120ms ease-out !important; }
  #cdBar { display:none; } #bPlay svg.cd { display:none; } .say .num { display:inline; }
  #bNext.cue::before { animation:none; opacity:.6; } .row.held .hold { animation:none; }
  .modes button, .nacts .pri, .lrow, .tg .dc svg, #bPrev svg.i, .ts { transition-duration:0ms !important; }
  #vload .shim::after { animation:none; left:30%; }
}
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="vbox">
      <video id="v" playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
      <div id="vload" class="vlayer show"><div class="t" id="ttl"></div><div class="st" id="sttl"></div><div class="cap" id="vcap">영상 불러오는 중</div><div class="shim"></div></div>
      <div id="vbuf" class="vlayer"><div class="disc"><div class="spin"></div></div></div>
      <div id="vpause" class="vlayer"><div class="disc"><svg class="i" viewBox="0 0 24 24"><use href="#ic-play" id="vpUse"/></svg></div></div>
      <div id="verr" class="vlayer" role="alert">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 3l18 18"/></svg>
        <div class="t" id="errT">영상 파일을 찾을 수 없어요</div>
        <div class="b" id="errB">같은 폴더에 <code id="vname">video.mp4</code>가 있어야 해요</div>
        <button type="button" id="pick">영상 직접 선택</button>
        <button type="button" id="retry" hidden>다시 시도</button>
        <input type="file" id="file" accept="video/*" hidden>
      </div>
      <a id="bHome" href="../" aria-label="목록으로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <button type="button" id="bAa" aria-label="보기 설정" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 19L8 5h1l5.5 14M4.6 14h7.8"/><path d="M14 19l3.5-8.5h1L22 19M15.3 16h5.4"/></svg></button>
    </div>
  </section>

  <div id="seek" role="slider" aria-label="재생 위치" aria-valuemin="0" tabindex="0">
    <span class="tm" id="tCur" aria-hidden="true">0:00</span>
    <div id="track"><div class="rail"></div><div class="fill" id="fill"></div><div id="ticks"></div><div id="thumb"></div><div id="bubble">0:00</div></div>
    <span class="tm" id="tDur" aria-hidden="true">0:00</span>
  </div>

  <div id="mid">
    <div id="list" role="list" aria-label="스크립트"></div>
    <div id="empty"><div class="t">자막이 없어요</div><div class="b">영상만 재생할 수 있어요.</div></div>
    <button type="button" id="pill" aria-label="지금 위치로 이동"><span><svg class="i" viewBox="0 0 24 24"><path id="pillArrow" d="M12 5v14M6 13l6 6 6-6"/></svg>지금 위치</span></button>
    <div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
  </div>

  <footer id="dock">
    <div id="ctl">
      <div class="seg" id="segHide" role="radiogroup" aria-label="보기">
        <button type="button" role="radio" data-v="0">모두</button><button type="button" role="radio" data-v="1" aria-label="영어만 (한글 가림)">영어만</button><button type="button" role="radio" data-v="2" aria-label="한글만 (영어 가림)">한글만</button>
      </div>
      <button type="button" class="chip" id="cSpeed" aria-haspopup="dialog" aria-label="재생 속도"><span id="speedLbl">1×</span></button>
    </div>
    <div id="bar">
      <div id="transport">
        <button type="button" class="tg" id="cLoop" aria-pressed="false"><span class="dc"><svg class="i sel" viewBox="0 0 24 24"><use href="#ic-loop1"/></svg></span><span class="lb">한 문장 반복</span></button>
        <button type="button" class="tb" id="bPrev" aria-label="이전 문장"><svg class="i pv" viewBox="0 0 24 24"><use href="#ic-prev"/></svg><svg class="i rp" viewBox="0 0 24 24"><use href="#ic-replay"/></svg></button>
        <button type="button" class="tb" id="bPlay" aria-label="재생" data-s="play"><span class="ring"></span>
          <svg class="cd" viewBox="0 0 66 66" aria-hidden="true"><circle class="bg" cx="33" cy="33" r="31.5"/><circle class="fg" cx="33" cy="33" r="31.5"/></svg>
          <svg class="i pi" viewBox="0 0 24 24"><use href="#ic-play"/></svg>
          <svg class="i pp" viewBox="0 0 24 24"><use href="#ic-pause"/></svg>
          <svg class="i pr" viewBox="0 0 24 24"><use href="#ic-replay"/></svg>
          <svg class="i pk" viewBox="0 0 24 24"><use href="#ic-folder"/></svg></button>
        <button type="button" class="tb" id="bNext" aria-label="다음 문장"><svg class="i" viewBox="0 0 24 24"><use href="#ic-next"/></svg></button>
        <button type="button" class="tg" id="cMode" aria-haspopup="dialog" aria-label="재생 방식: 연속 재생"><span class="dc"><svg class="i sel" viewBox="0 0 24 24" data-m="cont"><use href="#ic-cont"/></svg><svg class="i" viewBox="0 0 24 24" data-m="stop"><use href="#ic-stop1"/></svg><svg class="i" viewBox="0 0 24 24" data-m="shadow"><use href="#ic-mic"/></svg></span><span class="lb" id="modeLbl">연속 재생</span></button>
      </div>
    </div>
  </footer>
</div>

// ---------- relayout (font/hide/badge change, resize) ----------
var relayoutQueued = false;

// ---------- main loop ----------

// ---------- keyboard ----------
document.addEventListener('keydown', function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;

  } else {
    if (waiting && waitFrozen) { waitFrozen = false; startWait(waitI); }

  }

applyTheme(); applyFont(); applyCrop(); setSpeed(st.speed); setHide(st.hide); setMode(st.mode, true); markSaved(); updInstall(); setDur(D.duration || 0);
